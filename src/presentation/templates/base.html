<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Monopoly Arena — Tabletop Fintech{% endblock %}</title>

  <!-- Google Fonts: Outfit, JetBrains Mono, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            board: {
              light: '#F4F7F4',
              dark: '#0F172A',
              cardLight: '#FFFFFF',
              cardDark: '#1E293B',
              emerald: '#15803D',
              emeraldGlow: '#22C55E',
              hotelRed: '#DC2626',
              hotelGlow: '#EF4444',
            }
          }
        }
      }
    }
  </script>

  <!-- Script Antidestello de Tema (Dark/Light FOUC Prevention) -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <style>
    /* Suavizado de transiciones para dark mode */
    body {
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    /* Estilos de barras de scroll minimalistas */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-board-light dark:bg-board-dark text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header de Navegación Global -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/80 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand & Logo -->
      <a href="/" class="flex items-center gap-3 group focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 rounded-lg p-1">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 group-hover:scale-105 transition-transform">
          <span class="font-heading font-extrabold text-xl tracking-tight">M</span>
        </div>
        <div>
          <span class="font-heading font-extrabold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">
            Monopoly<span class="text-emerald-600 dark:text-emerald-400">Arena</span>
          </span>
          <span class="hidden sm:inline-block ml-2 text-xs font-mono font-semibold uppercase px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 border border-emerald-300/60 dark:border-emerald-800/60">
            Tabletop Fintech
          </span>
        </div>
      </a>

      <!-- Acciones de Cabecera -->
      <div class="flex items-center gap-3">
        {% block header_actions %}{% endblock %}

        <!-- Widget de Autenticación de Usuario -->
        <div id="auth-nav-widget" class="flex items-center">
          <button
            id="auth-login-btn"
            type="button"
            onclick="openAuthModal('login')"
            class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:border-emerald-500 hover:text-emerald-600 dark:hover:text-emerald-400 shadow-sm transition-all flex items-center gap-1.5"
          >
            <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
            <span>Ingresar</span>
          </button>

          <div id="auth-user-pill" class="hidden items-center gap-2 px-2.5 py-1 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800/60 text-xs font-medium text-emerald-800 dark:text-emerald-300">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="auth-username-disp" class="font-bold">Usuario</span>
            <button
              type="button"
              onclick="logoutUser()"
              class="ml-1 p-1 hover:text-red-600 rounded transition-colors"
              title="Cerrar sesión"
            >
              <i data-lucide="log-out" class="w-3 h-3"></i>
            </button>
          </div>
        </div>

        <!-- Botón Toggle de Tema (Claro / Oscuro) -->
        <button
          id="theme-toggle"
          type="button"
          aria-label="Cambiar tema de color"
          class="relative p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-emerald-600 dark:hover:text-emerald-400 hover:border-emerald-300 dark:hover:border-emerald-600 shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500"
        >
          <!-- Sol (Visible en Dark Mode) -->
          <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- Luna (Visible en Light Mode) -->
          <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer Discreto -->
  <footer class="mt-auto border-t border-slate-200 dark:border-slate-800/80 py-4 text-center text-xs text-slate-500 dark:text-slate-400">
    <p>Monopoly Arena • Clean Architecture & Fast Tabletop Tracking • 100% Serverless</p>
  </footer>

  <!-- Script de Intercambio de Tema -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const lightIcon = document.getElementById('theme-toggle-light-icon');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');

    function syncThemeIcons() {
      if (document.documentElement.classList.contains('dark')) {
        lightIcon.classList.remove('hidden');
        darkIcon.classList.add('hidden');
      } else {
        lightIcon.classList.add('hidden');
        darkIcon.classList.remove('hidden');
      }
    }

    syncThemeIcons();

    themeToggleBtn.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
      syncThemeIcons();
    });
  </script>

  <!-- Notificaciones Toasts Globales -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <script>
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all transform duration-300 translate-y-3 opacity-0 ${
        type === 'success'
          ? 'bg-emerald-600 text-white border-emerald-700 shadow-emerald-600/20'
          : 'bg-red-600 text-white border-red-700 shadow-red-600/20'
      }`;
      toast.innerHTML = `
        <span>${type === 'success' ? '✓' : '✕'}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>

  <!-- Modal Global de Autenticación (Login / Registro) -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <h3 id="auth-modal-title" class="font-heading font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
          <span>🔐</span> Identidad de Jugador
        </h3>
        <button type="button" onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Selector de Modo: Login / Registro -->
      <div class="flex p-1 bg-slate-100 dark:bg-slate-900/60 rounded-xl my-4 text-xs font-semibold">
        <button
          type="button"
          id="auth-tab-login"
          onclick="switchAuthTab('login')"
          class="flex-1 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-xs"
        >
          Iniciar Sesión
        </button>
        <button
          type="button"
          id="auth-tab-register"
          onclick="switchAuthTab('register')"
          class="flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
        >
          Crear Cuenta
        </button>
      </div>

      <div id="auth-error-box" class="hidden p-2.5 mb-3 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs text-red-600 dark:text-red-300 font-medium"></div>

      <form id="auth-form" onsubmit="submitAuthForm(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold uppercase text-slate-600 dark:text-slate-400 mb-1">Usuario</label>
          <input
            type="text"
            id="auth-username"
            required
            placeholder="ej: mago_financiero"
            class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500"
          />
        </div>

        <div id="auth-reg-extra" class="space-y-3 hidden">
          <div>
            <label class="block text-[11px] font-semibold uppercase text-slate-600 dark:text-slate-400 mb-1">Nombre Público (Opcional)</label>
            <input
              type="text"
              id="auth-display-name"
              placeholder="ej: Harry Potter"
              class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500"
            />
          </div>
          <div>
            <label class="block text-[11px] font-semibold uppercase text-slate-600 dark:text-slate-400 mb-1">Correo Electrónico (Opcional)</label>
            <input
              type="email"
              id="auth-email"
              placeholder="correo@ejemplo.com"
              class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500"
            />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold uppercase text-slate-600 dark:text-slate-400 mb-1">Contraseña</label>
          <input
            type="password"
            id="auth-password"
            required
            placeholder="••••••••"
            class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500"
          />
        </div>

        <button
          type="submit"
          id="auth-submit-btn"
          class="w-full mt-2 py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-heading font-bold text-sm shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-1.5"
        >
          <span id="auth-submit-label">Entrar</span>
          <span>→</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Gestor de Autenticación Global e Interceptor de Fetch -->
  <script>
    let currentAuthMode = 'login';

    window.getAuthToken = () => localStorage.getItem('monopoly_auth_token');
    window.getCurrentUser = () => {
      try { return JSON.parse(localStorage.getItem('monopoly_auth_user')); } catch (_) { return null; }
    };
    window.setAuthSession = (token, user) => {
      localStorage.setItem('monopoly_auth_token', token);
      localStorage.setItem('monopoly_auth_user', JSON.stringify(user));
      syncAuthUI();
    };
    window.clearAuthSession = () => {
      localStorage.removeItem('monopoly_auth_token');
      localStorage.removeItem('monopoly_auth_user');
      syncAuthUI();
    };

    function syncAuthUI() {
      const user = window.getCurrentUser();
      const loginBtn = document.getElementById('auth-login-btn');
      const userPill = document.getElementById('auth-user-pill');
      const nameDisp = document.getElementById('auth-username-disp');

      if (user && user.username) {
        if (loginBtn) loginBtn.classList.add('hidden');
        if (userPill) userPill.classList.remove('hidden');
        if (nameDisp) nameDisp.textContent = user.display_name || user.username;
      } else {
        if (loginBtn) loginBtn.classList.remove('hidden');
        if (userPill) userPill.classList.add('hidden');
      }
      if (window.lucide) lucide.createIcons();
    }

    function openAuthModal(mode = 'login') {
      const modal = document.getElementById('auth-modal');
      const errBox = document.getElementById('auth-error-box');
      if (errBox) errBox.classList.add('hidden');
      switchAuthTab(mode);
      if (modal) modal.classList.remove('hidden');
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      if (modal) modal.classList.add('hidden');
    }

    function switchAuthTab(mode) {
      currentAuthMode = mode;
      const tabLogin = document.getElementById('auth-tab-login');
      const tabRegister = document.getElementById('auth-tab-register');
      const regExtra = document.getElementById('auth-reg-extra');
      const submitLabel = document.getElementById('auth-submit-label');

      if (mode === 'login') {
        if (tabLogin) tabLogin.className = 'flex-1 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-xs';
        if (tabRegister) tabRegister.className = 'flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200';
        if (regExtra) regExtra.classList.add('hidden');
        if (submitLabel) submitLabel.textContent = 'Iniciar Sesión';
      } else {
        if (tabRegister) tabRegister.className = 'flex-1 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-xs';
        if (tabLogin) tabLogin.className = 'flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200';
        if (regExtra) regExtra.classList.remove('hidden');
        if (submitLabel) submitLabel.textContent = 'Crear Cuenta';
      }
    }

    async function submitAuthForm(e) {
      e.preventDefault();
      const errBox = document.getElementById('auth-error-box');
      if (errBox) errBox.classList.add('hidden');

      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const displayName = document.getElementById('auth-display-name')?.value?.trim();
      const email = document.getElementById('auth-email')?.value?.trim();

      const endpoint = currentAuthMode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';
      const payload = currentAuthMode === 'login' 
        ? { username, password }
        : { username, password, display_name: displayName || undefined, email: email || undefined };

      try {
        const res = await _originalFetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Error procesando autenticación.');
        }

        window.setAuthSession(data.access_token, data.user);
        closeAuthModal();
        showToast(`¡Bienvenido, ${data.user.display_name || data.user.username}!`);
      } catch (err) {
        if (errBox) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
        }
      }
    }

    function logoutUser() {
      window.clearAuthSession();
      showToast('Sesión cerrada correctamente');
    }

    // Interceptor global de fetch: adjunta Authorization automáticamente a las llamadas a /api/
    const _originalFetch = window.fetch;
    window.fetch = async function(input, init) {
      init = init || {};
      const token = window.getAuthToken();
      if (token) {
        const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        if (urlStr.includes('/api/')) {
          const headers = new Headers(init.headers || (typeof input !== 'string' && input.headers ? input.headers : {}));
          if (!headers.has('Authorization')) {
            headers.set('Authorization', `Bearer ${token}`);
          }
          init.headers = headers;
        }
      }
      return _originalFetch(input, init);
    };

    // Sincronizar estado al cargar cualquier página
    document.addEventListener('DOMContentLoaded', () => {
      syncAuthUI();
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
